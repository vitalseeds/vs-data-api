repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Complexity only: the rest of the ruff rule set still reports existing
  # violations, so it is not enforced yet.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      - id: ruff
        args: [--select, "C901,PLR0911,PLR0912,PLR0913,PLR0915,E9"]
