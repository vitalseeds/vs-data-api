name: Build Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Build executable
        run: uv run python deploy/build.py --clean

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsdata-server-windows
          path: dist/vsdata-server.exe
          retention-days: 30

  # Optional: Create a release with executables when a tag is pushed
  release:
    needs: [build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: vsdata-server-windows

      # - name: Download macOS artifact
      #   uses: actions/download-artifact@v4
      #   with:
      #     name: vsdata-server-macos

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: vsdata-server.exe
          generate_release_notes: true
