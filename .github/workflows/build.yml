name: Build Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Build executable
        run: uv run python deploy/build.py --clean

      - name: Build vsdata-doctor
        run: uv run pyinstaller vsdata-doctor.spec

      - name: Smoke-test the vsdata-doctor window
        # Opens and closes the Tk window to prove Tk and the sv-ttk theme are bundled.
        # Kept non-blocking in case a runner has no desktop session; check the result when it fails.
        continue-on-error: true
        shell: pwsh
        run: |
          $p = Start-Process dist/vsdata-doctor.exe -ArgumentList "--selftest" -Wait -PassThru
          exit $p.ExitCode

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsdata-server-windows
          path: |
            dist/vsdata-server.exe
            dist/vsdata-doctor.exe
          retention-days: 30

  # Optional: Create a release with executables when a tag is pushed
  release:
    needs: [build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: vsdata-server-windows

      # - name: Download macOS artifact
      #   uses: actions/download-artifact@v4
      #   with:
      #     name: vsdata-server-macos

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            vsdata-server.exe
            vsdata-doctor.exe
          generate_release_notes: true
